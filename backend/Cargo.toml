[package]
name = "vrm2sl-tauri"
version = "0.8.4-alpha.4"
default-run = "vrm2sl-tauri"
authors = ["Logue <logue@hotmail.co.jp>"]
edition = "2024"
rust-version = "1.97.1"
description = "VRM to Second Life converter desktop backend"
readme = "../README.md"
repository = "https://github.com/logue/vrm2sl"
homepage = "https://github.com/logue/vrm2sl"
license-file = "../LICENSE"
keywords = ["application", "desktop", "tauri", "vue"]
categories = ["gui"]

[lib]
name = "vrm2sl_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
gltf = { version = "1.4.1", features = ["import", "names"] }
glib = "0.22.8"
nalgebra = "0.35.0"
image = "0.25.10"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
jiff = { version = "0.2.35", features = ["serde"] }

tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-log = "2.9.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"

# macOS 固有の最適化
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.1"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc = "0.2.7"

# Apple Silicon (ARM64) 向けの設定
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "target-cpu=apple-a14"] # Apple Silicon互換性向上
