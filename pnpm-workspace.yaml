packages:
  - frontend
  - docs
allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  core-js: true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@intlify/bundle-utils@11.2.5'
  - '@intlify/unplugin-vue-i18n@11.2.5'
  - js-yaml@5.3.0
  - rollup-plugin-visualizer@7.1.1
overrides:
  tar: ">=7.5.22"
  ws: ">=8.21.3"
  js-yaml: ">=5.3.0"
  socket.io-parser: ">=4.2.7"
  brace-expansion: ">=5.0.9"
  esbuild: ">=0.28.2"
  "@babel/core": ">=8.0.1"
